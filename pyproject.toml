[project]
name = "knowledge-graph"
version = "0.1.0"
description = "Personal knowledge graph from Google Drive and Gmail using Claude for entity extraction"
requires-python = ">=3.11"
dependencies = [
    # Neo4j
    "neo4j>=5.0.0",

    # Google APIs
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.1.1",

    # Claude API
    "anthropic>=0.40.0",

    # Document processing
    "pymupdf>=1.24.0",
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "python-pptx>=0.6.23",

    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Rate limiting and retries
    "ratelimit>=2.2.1",
    "backoff>=2.2.1",
    "tenacity>=8.2.0",

    # HTTP client (for Ollama)
    "httpx>=0.27.0",

    # GraphRAG
    "neo4j-graphrag>=1.0.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "structlog>=23.2.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "xxhash>=3.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.7.0",
    "ruff>=0.1.6",
]

[project.scripts]
kg = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src", "config"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
